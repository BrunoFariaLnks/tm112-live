<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OU Guidance</title>
<meta name="description" content="Bruno's Open University guide: what to study, what's due, tutorials, time off and the degree plan.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OU Guidance">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #ffffff; --panel: #ffffff; --soft: #f5f6f8; --line: #e6e8ec; --ink: #0b0d12; --muted: #5f6673; --faint: #9aa0aa;
  --brand: #1f3fd1; --on-brand: #ffffff;
  --deadline: #d9480f; --deadline-bg: #fff2eb;
  --tutorial: #1f63e0; --tutorial-bg: #ebf2ff;
  --study: #6a3fd6; --study-bg: #f2edfd;
  --timeoff: #1c8a4a; --timeoff-bg: #e8f7ee;
  --registration: #a8620a; --registration-bg: #fdf3e2;
  --good: #1c8a4a; --warn: #c2410c; --shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.06);
  --radius: 18px; --tab-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1117; --panel: #161a22; --soft: #1d222c; --line: #2a303c; --ink: #f2f4f8; --muted: #a3abb9; --faint: #6b7383;
  --brand: #8da2ff; --on-brand: #0e1117;
  --deadline: #ff8a50; --deadline-bg: #3a1f12; --tutorial: #7fa8ff; --tutorial-bg: #16233f;
  --study: #b79bff; --study-bg: #261c3f; --timeoff: #5fd38f; --timeoff-bg: #112d1e;
  --registration: #f0b45b; --registration-bg: #33260f; --good: #5fd38f; --warn: #ff8a50; --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1117; --panel: #161a22; --soft: #1d222c; --line: #2a303c; --ink: #f2f4f8; --muted: #a3abb9; --faint: #6b7383;
  --brand: #8da2ff; --on-brand: #0e1117;
  --deadline: #ff8a50; --deadline-bg: #3a1f12; --tutorial: #7fa8ff; --tutorial-bg: #16233f;
  --study: #b79bff; --study-bg: #261c3f; --timeoff: #5fd38f; --timeoff-bg: #112d1e;
  --registration: #f0b45b; --registration-bg: #33260f; --good: #5fd38f; --warn: #ff8a50; --shadow: none; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
.li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
.feed { display: grid; grid-template-columns: 10px 1fr; gap: 12px; align-items: start; }
.feed .dot { margin-top: 8px; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; letter-spacing: -.02em; line-height: 1.2; }
h1 { font-size: 30px; font-weight: 800; }
h2 { font-size: 21px; font-weight: 750; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
a { color: var(--brand); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
.muted { color: var(--muted); } .small { font-size: 14px; } .num { font-variant-numeric: tabular-nums; }

.app { min-height: 100vh; }
main { max-width: 760px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 20px) max(16px, env(safe-area-inset-right)) calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px) max(16px, env(safe-area-inset-left)); }
.screen { display: none; flex-direction: column; gap: 16px; animation: fade .2s ease; }
.screen.on { display: flex; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
.head .sub { color: var(--muted); margin-top: 4px; }

nav.tabs { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding: 6px 4px calc(env(safe-area-inset-bottom) + 6px); }
nav.tabs button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 600; color: var(--faint); border-radius: 12px; }
nav.tabs button svg { width: 26px; height: 26px; }
nav.tabs button[aria-current="page"] { color: var(--brand); }
@media (min-width: 1000px) {
  nav.tabs { top: 0; right: auto; width: 220px; flex-direction: column; justify-content: flex-start; gap: 4px; border-top: 0; border-right: 1px solid var(--line); padding: 28px 14px; }
  nav.tabs::before { content: "OU Guidance"; font-weight: 800; font-size: 20px; color: var(--ink); padding: 0 12px 18px; }
  nav.tabs button { flex: none; flex-direction: row; gap: 12px; padding: 12px; font-size: 16px; color: var(--muted); }
  nav.tabs button[aria-current="page"] { background: var(--soft); color: var(--ink); }
  main { padding-left: 260px; max-width: 1080px; padding-bottom: 48px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
}

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.tight { gap: 8px; }
.label { font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; background: var(--c, var(--muted)); }
.c-deadline { --c: var(--deadline); --cb: var(--deadline-bg); } .c-tutorial { --c: var(--tutorial); --cb: var(--tutorial-bg); }
.c-study { --c: var(--study); --cb: var(--study-bg); } .c-timeoff { --c: var(--timeoff); --cb: var(--timeoff-bg); }
.c-registration { --c: var(--registration); --cb: var(--registration-bg); }
.accent { border-left: 5px solid var(--c); }
.big { font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--c, var(--ink)); }
.unit { font-size: 17px; font-weight: 650; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { border-radius: var(--radius); padding: 16px; background: var(--cb, var(--soft)); display: flex; flex-direction: column; gap: 4px; min-width: 0; border: 0; text-align: left; }
.tile b { font-size: 30px; line-height: 1.05; color: var(--c); font-variant-numeric: tabular-nums; }
.tile span { font-size: 14px; color: var(--ink); }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--cb, var(--soft)); color: var(--c, var(--ink)); white-space: nowrap; }
.pill.good { --c: var(--good); --cb: var(--timeoff-bg); } .pill.bad { --c: var(--warn); --cb: var(--deadline-bg); }
.btn { border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 700; font-size: 16px; background: var(--brand); color: var(--on-brand); display: inline-flex; align-items: center; gap: 8px; text-decoration: none; min-height: 44px; }
.btn.ghost { background: var(--soft); color: var(--ink); }
.btn.small { padding: 8px 14px; font-size: 14px; min-height: 36px; }
.btn svg { width: 20px; height: 20px; }
.warn { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--warn); font-weight: 600; }
.note { font-size: 14px; color: var(--muted); background: var(--soft); border-radius: 12px; padding: 10px 12px; }

.check { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.check:first-of-type { border-top: 0; }
.check input { appearance: none; -webkit-appearance: none; flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--faint); margin: 0; display: grid; place-items: center; cursor: pointer; background: var(--panel); }
.check input:checked { background: var(--good); border-color: var(--good); }
.check input:checked::after { content: ""; width: 7px; height: 13px; border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
.check.done span { color: var(--faint); text-decoration: line-through; }
.check span { padding-top: 1px; }
.progress { height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--c, var(--brand)); border-radius: 99px; transition: width .4s ease; }

.seg { display: flex; background: var(--soft); border-radius: 14px; padding: 4px; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.seg button { flex: 1; border: 0; background: none; padding: 9px 12px; border-radius: 10px; font-weight: 700; font-size: 15px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 13px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--c); color: var(--ink); background: var(--cb); }

.month { font-weight: 800; font-size: 15px; color: var(--muted); margin: 14px 2px 2px; }
.ev { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: start; padding: 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.ev .d { text-align: center; border-radius: 12px; background: var(--cb); color: var(--c); padding: 5px 0; }
.ev .d b { display: block; font-size: 21px; line-height: 1.1; } .ev .d small { display: block; font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; }
.ev .t { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ev .t h3 { font-size: 16px; } .ev .t p { font-size: 14px; color: var(--muted); }
.ev.past { opacity: .5; } .ev.done h3 { text-decoration: line-through; color: var(--muted); }
.ev .go { color: var(--faint); align-self: center; }
.list { display: flex; flex-direction: column; gap: 8px; }

.road { display: flex; flex-direction: column; }
.stop { display: grid; grid-template-columns: 28px 1fr; gap: 12px; }
.stop .rail { display: flex; flex-direction: column; align-items: center; }
.stop .rail i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--c); background: var(--panel); margin-top: 3px; flex: none; }
.stop.done .rail i { background: var(--c); }
.stop .rail s { flex: 1; width: 3px; background: var(--line); margin: 4px 0; }
.stop:last-child .rail s { display: none; }
.stop .body { padding-bottom: 18px; display: flex; flex-direction: column; gap: 4px; }
.ring { width: 120px; height: 120px; flex: none; }

dialog { border: 0; border-radius: 22px; padding: 22px; max-width: 520px; width: calc(100% - 32px); background: var(--panel); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10,12,18,.45); backdrop-filter: blur(3px); }
details { border-top: 1px solid var(--line); padding: 12px 0; }
details:first-of-type { border-top: 0; }
summary { font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
summary::after { content: "+"; color: var(--muted); font-size: 20px; line-height: 1; }
details[open] summary::after { content: "−"; }
details ol { margin: 10px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.switch:first-of-type { border-top: 0; }
.switch input { appearance: none; -webkit-appearance: none; width: 52px; height: 32px; border-radius: 99px; background: var(--line); position: relative; flex: none; cursor: pointer; transition: background .2s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch input:checked { background: var(--good); } .switch input:checked::after { transform: translateX(20px); }
.say { font-size: 16px; line-height: 1.6; background: var(--soft); border-radius: 14px; padding: 14px; }
.empty { color: var(--muted); padding: 8px 0; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); }
th { color: var(--muted); font-size: 13px; font-weight: 700; border-top: 0; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 650; font-size: 15px; z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.on { opacity: 1; }
@media (max-width: 380px) { .big { font-size: 38px; } h1 { font-size: 26px; } }
</style>
</head>
<body>
<div class="app">
  <main>
    <section class="screen on" id="today" aria-label="Today"></section>
    <section class="screen" id="plan" aria-label="Plan"></section>
    <section class="screen" id="calendar" aria-label="Calendar"></section>
    <section class="screen" id="degree" aria-label="Degree"></section>
    <section class="screen" id="more" aria-label="More"></section>
  </main>
  <nav class="tabs" aria-label="Main">
    <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
    <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Plan</button>
    <button data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Calendar</button>
    <button data-tab="degree"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>Degree</button>
    <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>More</button>
  </nav>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
