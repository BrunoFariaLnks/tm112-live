<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutorials</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tutorials">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --soft: #f6f6f8; --line: #e8e8ec; --text: #000000; --muted: #6b6b73;
    --accent: #2b50e8; --accent-soft: #eef2ff; --gold: #b8935a; --gold-soft: #faf5ec;
    --live: #c2410c; --live-soft: #fff1ea; --ok: #047857; --ok-soft: #e9f8f1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
  body { min-height: 100vh; padding: calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 32px); }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .brand, h2 { font-variant-numeric: lining-nums; }
  .brand { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 32px; font-weight: 600; letter-spacing: .2px; }
  .brand span { color: var(--gold); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .pill { font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 7px 11px; border-radius: 999px; }

  .hero { position: relative; overflow: hidden; border-radius: 26px; padding: 22px; background: #fff;
    border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 18px 40px rgba(20,30,80,.08); }
  .hero::before { content: ''; position: absolute; left: 0; top: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--accent), var(--gold)); }
  .eyebrow { text-transform: uppercase; letter-spacing: 2px; font-size: 11px; font-weight: 600; color: var(--accent); }
  .hero h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 32px; line-height: 1.1; margin: 10px 0 6px; font-weight: 600; }
  .hero .when { color: var(--text); font-size: 15px; font-weight: 500; }
  .count { display: flex; gap: 10px; margin-top: 18px; }
  .count div { flex: 1; text-align: center; background: var(--soft); border-radius: 14px; padding: 10px 0; }
  .count b { display: block; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .count small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .hero button { margin-top: 16px; }

  .bar { margin: 18px 0 8px; border-radius: 18px; padding: 14px 16px; background: var(--gold-soft); border: 1px solid #f0e6d4; font-size: 14px; line-height: 1.5; }
  .bar.ok { background: var(--ok-soft); border-color: #cdeedd; color: var(--ok); }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button, .btn { appearance: none; border: 0; cursor: pointer; font: 600 14px Inter, sans-serif; text-decoration: none;
    padding: 12px 16px; border-radius: 14px; color: #fff; background: #000; display: inline-block; }
  .ghost { background: #fff; color: #000; border: 1px solid var(--line); }

  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin: 28px 4px 12px; font-weight: 600; }
  .card { display: flex; gap: 14px; align-items: center; padding: 14px; margin-bottom: 10px; border-radius: 20px;
    background: #fff; border: 1px solid var(--line); cursor: pointer; transition: transform .15s; }
  .card:active { transform: scale(.98); }
  .date { width: 54px; flex: none; text-align: center; border-radius: 14px; padding: 8px 0; background: var(--accent-soft); }
  .date b { display: block; font-size: 20px; color: #000; }
  .date small { font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
  .info { flex: 1; min-width: 0; }
  .info .t { font-weight: 600; font-size: 15px; }
  .info .m { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .tag { white-space: nowrap; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; padding: 3px 7px; border-radius: 6px; margin-left: 6px; vertical-align: 2px; }
  .live { color: var(--live); background: var(--live-soft); }
  .rec { color: var(--ok); background: var(--ok-soft); }
  .done { opacity: .4; }
  .chev { color: var(--gold); font-size: 22px; }

  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.25); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet.open { display: flex; }
  .panel { width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; border-radius: 28px 28px 0 0; background: #fff;
    padding: 22px 22px calc(env(safe-area-inset-bottom) + 26px); animation: up .25s ease-out; box-shadow: 0 -10px 40px rgba(0,0,0,.12); }
  @keyframes up { from { transform: translateY(40px); opacity: 0 } }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: -6px auto 16px; }
  .panel h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 32px; margin: 8px 0 4px; line-height: 1.1; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0; }
  .facts div { background: var(--soft); border-radius: 14px; padding: 10px 12px; }
  .facts small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .facts b { font-size: 14px; font-weight: 600; }
  .panel p { color: #000; line-height: 1.6; }
  ol { list-style: none; padding: 0; margin: 10px 0 20px; counter-reset: s; }
  ol li { counter-increment: s; display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); line-height: 1.45; }
  ol li::before { content: counter(s); flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; font-weight: 600; color: #fff; background: var(--accent); }
  .note { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">TM112 <span>Live</span></div>
      <div class="sub">Your booked tutorials · UK time</div>
    </div>
    <div class="pill" id="left"></div>
  </header>

  <section class="hero" id="hero"></section>
  <div class="bar" id="notify"></div>

  <h3>Coming up</h3>
  <div id="upcoming"></div>
  <h3 id="pastH">Done</h3>
  <div id="past"></div>
  <p class="note" style="margin-top:24px">Step by step plans are based on the official OU session descriptions. Tutors may adjust on the day.</p>
</div>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script type="module">
import { SESSIONS, ukISO } from './data.js';

const VAPID = 'BAh2Vdi6MqPmL2HkTY18PYVvtlO5JVn1B_VTwDhFXm8OnUnGF7YDICPDKiU4xfT0pfjO7sUBJEChY5ycx_FEAUI';
const API = 'https://tbajesdgqzbxbxmojcem.supabase.co/functions/v1/tm112-push';
const TUTORIALS = 'https://msds.open.ac.uk/students/tutorials/index.aspx';
const $ = (id) => document.getElementById(id);
const startOf = (s) => new Date(ukISO(s.date, s.start));
const endOf = (s) => new Date(ukISO(s.date, s.end));
const day = (s) => new Date(s.date + 'T12:00:00Z');
const fmtDay = (s) => day(s).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
const tag = (s) => s.recorded === true ? '<span class="tag rec">Recorded</span>' : s.recorded === false ? '<span class="tag live">Live only</span>' : '';

function card(s, done) {
  const d = day(s);
  return `<div class="card ${done ? 'done' : ''}" data-id="${s.id}">
    <div class="date"><b>${d.getUTCDate()}</b><small>${d.toLocaleDateString('en-GB', { month: 'short', timeZone: 'UTC' })}</small></div>
    <div class="info"><div class="t">${s.title}</div><div class="m">${s.start} to ${s.end} · ${s.tutor.replace(' (your tutor)', '')}${tag(s)}</div></div>
    <div class="chev">›</div></div>`;
}

function render() {
  const now = new Date();
  const up = SESSIONS.filter((s) => endOf(s) > now);
  const past = SESSIONS.filter((s) => endOf(s) <= now);
  $('left').textContent = `${up.length} to go`;
  $('upcoming').innerHTML = up.map((s) => card(s, false)).join('') || '<p class="note">All done. Well played.</p>';
  $('past').innerHTML = past.map((s) => card(s, true)).join('');
  $('pastH').style.display = past.length ? '' : 'none';
  const n = up[0];
  if (!n) { $('hero').innerHTML = '<div class="eyebrow">All sessions complete</div>'; return; }
  const live = startOf(n) <= now;
  const ms = Math.max(0, startOf(n) - now);
  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60;
  $('hero').innerHTML = `<div class="eyebrow">${live ? 'Happening now' : 'Next session'}</div>
    <h2>${n.title}</h2><div class="when">${fmtDay(n)} · ${n.start} to ${n.end}</div>
    ${live ? '' : `<div class="count"><div><b>${d}</b><small>days</small></div><div><b>${h}</b><small>hours</small></div><div><b>${m}</b><small>mins</small></div></div>`}
    <button data-id="${n.id}">What happens in this session</button>`;
}

function openSheet(id) {
  const s = SESSIONS.find((x) => x.id === id);
  if (!s) return;
  $('panel').innerHTML = `<div class="grab"></div><div class="eyebrow">${s.block}</div><h2>${s.title}</h2>
    <div class="when" style="color:var(--muted)">${fmtDay(s)}</div>
    <div class="facts">
      <div><small>Time</small><b>${s.start} to ${s.end}</b></div>
      <div><small>Tutor</small><b>${s.tutor}</b></div>
      <div><small>Where</small><b>Online</b></div>
      <div><small>Recording</small><b>${s.recorded === true ? 'Yes' : s.recorded === false ? 'No, live only' : 'Not stated'}</b></div>
    </div>
    <p>${s.summary}</p>
    <div class="eyebrow" style="margin-top:18px">Step by step</div>
    <ol>${s.steps.map((x) => `<li>${x}</li>`).join('')}</ol>
    <div class="row"><a class="btn" href="${TUTORIALS}" target="_blank" rel="noopener">Open my OU tutorials</a><button class="ghost" id="close">Close</button></div>`;
  $('sheet').classList.add('open');
  history.replaceState(null, '', '#' + id);
}
function closeSheet() { $('sheet').classList.remove('open'); history.replaceState(null, '', location.pathname); }

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-id]');
  if (t) return openSheet(t.dataset.id);
  if (e.target.id === 'close' || e.target.id === 'sheet') closeSheet();
});

// Notifications
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const b64 = (s) => Uint8Array.from(atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));

async function notifyUI() {
  const el = $('notify');
  if (!('serviceWorker' in navigator)) { el.textContent = 'This browser does not support reminders.'; return; }
  const reg = await navigator.serviceWorker.register('./sw.js');
  if (!standalone && /iPhone|iPad/.test(navigator.userAgent)) {
    el.innerHTML = '<b>Step 1:</b> tap the Share button in Safari.<br><b>Step 2:</b> tap <b>Add to Home Screen</b>.<br><b>Step 3:</b> open Tutorials from your home screen to turn on reminders.';
    return;
  }
  if (!('PushManager' in window)) { el.textContent = 'Reminders need iOS 16.4 or newer.'; return; }
  const sub = await reg.pushManager.getSubscription();
  if (sub && Notification.permission === 'granted') {
    el.className = 'bar ok';
    el.innerHTML = 'Reminders are on: the day before, the morning of, and 30 minutes before each session.<div class="row"><button class="ghost" id="test">Send a test</button></div>';
    fetch(API + '?action=subscribe', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(sub) });
  } else {
    el.innerHTML = 'Turn on reminders so you never miss a session.<div class="row"><button id="enable">Turn on reminders</button></div>';
  }
}

document.addEventListener('click', async (e) => {
  if (e.target.id === 'enable') {
    if (await Notification.requestPermission() !== 'granted') { alert('Notifications were not allowed. You can allow them in iPhone Settings > Notifications > Tutorials.'); return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID) });
    await fetch(API + '?action=subscribe', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(sub) });
    await fetch(API + '?action=test');
    notifyUI();
  }
  if (e.target.id === 'test') { e.target.textContent = 'Sent ✓'; fetch(API + '?action=test'); }
});

render();
setInterval(render, 30000);
notifyUI();
if (location.hash) openSheet(location.hash.slice(1));
</script>
</body>
</html>
